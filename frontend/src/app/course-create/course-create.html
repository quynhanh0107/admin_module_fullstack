<div class="container-fluid mt-3">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom border-primary border-3 py-3">
          <h4 class="mb-0 text-primary">Thêm Khóa Học Mới</h4>
        </div>
        
        <div class="card-body p-4">
          <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

          <form (ngSubmit)="onSubmit()">
            
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Mã khóa học (VD: IT101)</label>
                <input type="text" class="form-control" name="courseCode" [(ngModel)]="course.courseCode" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Tên khóa học</label>
                <input type="text" class="form-control" name="name" [(ngModel)]="course.name" required>
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label fw-bold">Số tín chỉ</label>
                <input type="number" class="form-control" name="credits" [(ngModel)]="course.credits" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Loại hình</label>
                <select class="form-select" name="courseType" [(ngModel)]="course.courseType">
                  <option value="BẮT BUỘC">Bắt buộc</option>
                  <option value="TỰ CHỌN">Tự chọn</option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" routerLink="/courses">Hủy bỏ</button>
              <button type="submit" class="btn btn-primary">Lưu Khóa Học</button>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
