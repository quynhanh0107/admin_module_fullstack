<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100" style="background-color: #eef4ff;">
    <div class="login-container">
        <div class="card border-0 shadow-sm rounded-4" style="width: 380px;">
            <div class="card-body p-4 p-md-5">

                <!-- Icon + tiêu đề -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                         style="width: 64px; height: 64px; background-color: #e7f1ff;">
                        <i class="bi bi-mortarboard-fill fs-3" style="color: #0d6efd;"></i>
                    </div>
                    <h2 class="h4 fw-bold text-dark mb-1">Đăng nhập</h2>
                    <p class="text-muted small mb-0">Truy cập Hệ thống Học Vụ</p>
                </div>

                <form (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0" style="border-color: #dee2e6;">
                                <i class="bi bi-person text-muted"></i>
                            </span>
                            <input type="text" name="username" [(ngModel)]="username"
                                   class="form-control border-start-0 ps-0"
                                   placeholder="Nhập tên đăng nhập" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0" style="border-color: #dee2e6;">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" [(ngModel)]="password"
                                   class="form-control border-start-0 ps-0"
                                   placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn w-100 fw-semibold text-white py-2"
                            style="background-color: #0d6efd; border-radius: 8px;">
                        Đăng nhập
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                     Hệ thống Học Vụ
                </p>
            </div>
        </div>
    </div>
</div>
